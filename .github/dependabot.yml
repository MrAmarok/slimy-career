# Mises à jour de sécurité et de versions, proposées en pull requests.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: bun
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      angular:
        patterns: ["@angular/*"]
  - package-ecosystem: pip
    directory: /scraper
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/", "/scraper"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
