# Déploiement : base PostgreSQL + application + service de recherche d'offres + tunnel Cloudflare.
#
#   cp .env.example .env    puis remplir les mots de passe
#   docker compose up -d --build                       # application sur http://localhost:8080 (cette machine seulement)
#   docker compose --profile tunnel up -d --build      # + accès depuis Internet par le tunnel Cloudflare (HTTPS)
#
# Cloisonnement des réseaux :
#   base      db <-> app                 réseau interne, sans accès à Internet ; la base n'est joignable que par l'application
#   recherche app <-> scraper            le service de recherche ne voit ni la base ni le tunnel
#   entree    app <-> cloudflared

services:
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidatures
      POSTGRES_USER: candidatures
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [base]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidatures -d candidatures"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/candidatures
      DATABASE_USER: candidatures
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      # adresse du visiteur : en-tête écrit par Cloudflare (le visiteur ne peut pas le falsifier)
      APP_CLIENT_IP_HEADER: ${APP_CLIENT_IP_HEADER:-CF-Connecting-IP}
      SCRAPER_URL: http://scraper:8000
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      TZ: ${TZ:-Europe/Paris}
    networks: [base, recherche, entree]
    ports:
      # accessible seulement depuis cette machine ; l'accès extérieur passe par le tunnel
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Recherche d'offres (LinkedIn, HelloWork, Indeed) : visite des sites tiers et dépend de bibliothèques externes,
  # donc isolée. Aucune variable d'environnement, aucun secret, pas d'accès à la base, système de fichiers en lecture seule.
  scraper:
    build: ./scraper
    restart: unless-stopped
    networks: [recherche]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256

  # Tunnel Cloudflare : connexion sortante vers Cloudflare, qui sert l'application en HTTPS sur ton domaine.
  # Dans Zero Trust > Networks > Tunnels, le « public hostname » doit pointer vers le service  http://app:8080
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [entree]
    depends_on:
      - app

networks:
  base:
    internal: true
  recherche:
  entree:

volumes:
  db-data:
