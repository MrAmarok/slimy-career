spring:
  application:
    name: candidatures
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/candidatures}
    username: ${DATABASE_USER:candidatures}
    password: ${DATABASE_PASSWORD:candidatures}
  servlet:
    multipart:
      max-file-size: 20MB       # import de CV en PDF
      max-request-size: 21MB

server:
  port: ${PORT:8080}
  # derrière le reverse proxy (Caddy) : fait confiance aux en-têtes X-Forwarded-* (HTTPS, adresse du client)
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain

app:
  # premier compte, créé au démarrage s'il n'y a encore aucun utilisateur
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
  # clé de chiffrement des secrets rangés en base (double authentification, clés d'API) : longue chaîne aléatoire, à ne jamais changer
  secret-key: ${APP_SECRET_KEY:}
  # en-tête qui porte l'adresse du visiteur ; derrière Caddy : X-Real-IP
  client-ip-header: ${APP_CLIENT_IP_HEADER:}
  # service de recherche d'offres (scraper/server.py), isolé du serveur : il ne reçoit aucun secret
  scraper:
    url: ${SCRAPER_URL:http://localhost:8000}
  # clé SerpAPI (Google Jobs) commune à tous les comptes ; chaque utilisateur peut mettre la sienne dans ses paramètres.
  # La clé DeepL, elle, est propre à chaque utilisateur (enregistrée avec son compte).
  keys:
    serpapi: ${SERPAPI_KEY:}
  languagetool-url: ${LANGUAGETOOL_URL:https://api.languagetool.org/v2/check}

logging:
  level:
    # les polices standard du PDF ne sont pas embarquées : l'avertissement « fallback font » est sans objet
    org.apache.pdfbox.pdmodel.font: ERROR
